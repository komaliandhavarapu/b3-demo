<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWithLove · Birthday Note</title>
<link rel="stylesheet" href="style.css">
<style>
.page-two{
  min-height:100svh;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(circle at 50% 35%,#fff 0,transparent 34%),
    linear-gradient(145deg,#fff1f5 0%,#eee4fa 52%,#e6daf4 100%);
}
.page-two:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
  background:
    radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 87% 25%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 18% 83%,#fff 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 83% 78%,#fff 0 1.5px,transparent 2.5px);
}
.page-two .decor{position:absolute;font-size:1.5rem;color:#e487a3;opacity:.5;animation:twinkle 3.5s ease-in-out infinite}
.page-two .d1{left:10%;top:20%}.page-two .d2{right:12%;top:17%;animation-delay:.8s}.page-two .d3{left:14%;bottom:20%;animation-delay:1.5s}.page-two .d4{right:15%;bottom:24%;animation-delay:2.2s}
.page-two .wrap{position:relative;z-index:2;width:min(820px,100%)}
.page-two .eyebrow{
  color:#8a6d9d;text-transform:uppercase;letter-spacing:.24em;
  font-size:.66rem;margin-bottom:15px;
}
.page-two h2{font-size:clamp(3.2rem,8vw,6.2rem);margin-bottom:7px}
.page-two .intro{max-width:590px;margin:0 auto 28px;color:#75657f;line-height:1.8}
.page-two .letter-card{
  width:min(700px,100%);margin:0 auto 28px;padding:39px 43px;
  position:relative;text-align:left;background:#fffdf9;
  border:1px solid #fff;border-radius:8px;
  box-shadow:0 22px 60px rgba(81,58,101,.16);
}
.page-two .letter-card:before{
  content:"";position:absolute;inset:10px;border:1px solid #c99d6350;
  pointer-events:none;
}
.page-two .letter-card:after{
  content:"♥";position:absolute;right:25px;top:18px;
  color:#ef91a9;font-size:1.4rem;opacity:.75;
}
.page-two .letter-card p{
  position:relative;z-index:1;margin:0 0 18px;
  color:#665b68;line-height:2;font-size:.94rem;
}
.page-two .letter-card p:last-child{margin-bottom:0}
.page-two .mini-cake{
  font-size:3.5rem;display:inline-block;margin:3px 0 18px;
  animation:gentleBounce 2.5s ease-in-out infinite;
}
.page-two .next{
  display:inline-flex;align-items:center;gap:9px;
  border:0;border-radius:999px;padding:15px 28px;
  background:linear-gradient(100deg,#a876d0,#f17f9d);
  color:#fff;font:600 .86rem 'DM Sans',sans-serif;
  text-decoration:none;box-shadow:0 15px 35px rgba(133,92,164,.24);
  transition:.25s;
}
.page-two .next:hover{transform:translateY(-4px);box-shadow:0 20px 42px rgba(133,92,164,.32)}
.page-two .footer-note{
  position:absolute;bottom:19px;left:50%;transform:translateX(-50%);
  font-size:.57rem;letter-spacing:.22em;text-transform:uppercase;color:#9a88a4;
  white-space:nowrap;
}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.2);opacity:.75}}
@keyframes gentleBounce{50%{transform:translateY(-7px)}}
@media(max-width:650px){
  .page-two{padding-top:72px}
  .page-two .letter-card{padding:31px 24px}
  .page-two .letter-card:before{inset:8px}
  .page-two .footer-note{bottom:10px}
}
</style>
</head>
<body>
<button class="music" id="music" type="button" aria-pressed="false">♫ Play music</button>

<section class="page page-two">
  <span class="decor d1">✦</span>
  <span class="decor d2">♡</span>
  <span class="decor d3">✦</span>
  <span class="decor d4">♡</span>

  <div class="wrap">
    <div class="eyebrow">a little birthday note</div>
    <div class="mini-cake">🎂</div>
    <h2 id="title"></h2>
    <p class="intro" id="intro"></p>

    <article class="letter-card">
      <p id="one"></p>
      <p id="two"></p>
    </article>

    <a class="next" href="journey.html">See our journey <span>→</span></a>
  </div>

  <div class="footer-note">made with love · OpenWithLove</div>
</section>

<script src="config.js"></script>
<script>
const c=customer;
document.getElementById("title").textContent=c.wishTitle||"Happy Birthday, Your Name";
document.getElementById("intro").textContent=c.wishIntro||"Today is all about celebrating you and everything that makes you special.";
document.getElementById("one").textContent=c.wishOne||"";
document.getElementById("two").textContent=c.wishTwo||"";

</script>
<script src="app.js" data-persistent></script>
</body>
</html>
