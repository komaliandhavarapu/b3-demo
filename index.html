<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWithLove · B3</title>
<link rel="stylesheet" href="style.css">
<style>
.page-one{
  min-height:100svh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.88) 0 12%,transparent 38%),
    linear-gradient(145deg,#eee6fb 0%,#e6daf5 46%,#fff0f5 100%);
  position:relative;
}
.page-one:before{
  content:"";
  position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:
    radial-gradient(circle at 18% 22%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 82% 17%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 12% 76%,#fff 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 88% 72%,#fff 0 1.5px,transparent 2.5px);
}
.page-one .wrap{position:relative;z-index:2;max-width:760px}
.page-one .tiny{
  display:inline-flex;align-items:center;gap:10px;
  color:#856d99;font-size:.66rem;letter-spacing:.25em;
  text-transform:uppercase;
}
.page-one .tiny:before,.page-one .tiny:after{
  content:"";width:24px;height:1px;background:#b797ca;
}
.page-one h1{
  margin:17px 0 10px;
  font-size:clamp(4rem,10vw,7.5rem);
  text-shadow:0 7px 25px rgba(112,74,139,.12);
}
.page-one .subtitle{
  margin:0 auto;max-width:560px;color:#685878;
  font-size:1.02rem;line-height:1.8;
}
.page-one .character{
  width:220px;height:220px;margin:24px auto 12px;
  display:grid;place-items:center;position:relative;
}
.page-one .character .glow{
  position:absolute;width:190px;height:150px;border-radius:50%;
  background:#f6a9c755;filter:blur(25px);
}
.page-one .character .bear{
  position:relative;font-size:8.2rem;z-index:2;
  animation:b3float 4s ease-in-out infinite;
  filter:drop-shadow(0 18px 20px rgba(80,55,98,.18));
}
.page-one .character .heart{
  position:absolute;z-index:3;bottom:14px;
  font:3.5rem Arial;color:#ff527e;
  animation:b3heart 1.7s ease-in-out infinite;
}
.page-one .note{
  max-width:500px;margin:4px auto 23px;
  color:#75657f;font-size:.94rem;line-height:1.8;
}
.page-one .start{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 28px;border-radius:999px;border:0;
  background:linear-gradient(100deg,#a876d0,#f17f9d);
  color:#fff;font:600 .86rem 'DM Sans',sans-serif;
  box-shadow:0 15px 35px rgba(133,92,164,.25);
  cursor:pointer;text-decoration:none;transition:.25s;
}
.page-one .start:hover{transform:translateY(-4px);box-shadow:0 20px 42px rgba(133,92,164,.34)}
.page-one .start span{font-size:1rem}
.page-one .corner{
  position:absolute;z-index:1;font-size:1.35rem;opacity:.55;
  animation:b3drift 5s ease-in-out infinite;
}
.page-one .c1{left:12%;top:20%}.page-one .c2{right:12%;top:27%;animation-delay:1s}
.page-one .c3{left:17%;bottom:20%;animation-delay:2s}.page-one .c4{right:17%;bottom:18%;animation-delay:3s}
.page-one .bottom-mark{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;color:#9a88a4;
}
@keyframes b3float{50%{transform:translateY(-10px)}} 
@keyframes b3heart{50%{transform:translateX(-50%) scale(1.12)}} 
@keyframes b3drift{50%{transform:translateY(-9px) rotate(8deg)}}
</style>
</head>
<body>
<button class="music" id="music" type="button" aria-pressed="false">♫ Play music</button>

<section class="page page-one">
  <span class="corner c1">✦</span>
  <span class="corner c2">♡</span>
  <span class="corner c3">✦</span>
  <span class="corner c4">♡</span>

  <div class="wrap">
    <div class="tiny" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="character" aria-hidden="true">
      <div class="glow"></div>
      <div class="bear">🧸</div>
      <div class="heart">♥</div>
    </div>

    <p class="note" id="note"></p>
    <a class="start" href="wishes.html">Do you wanna see? <span>✦</span></a>
  </div>

  <div class="bottom-mark">OpenWithLove · a little world made for you</div>
</section>

<script src="config.js"></script>
<script>
const c=customer;
document.getElementById("eyebrow").textContent=c.heroEyebrow||"a little something for you";
document.getElementById("title").textContent=c.heroTitle||"Hello, Your Name";
document.getElementById("subtitle").textContent=c.heroSubtitle||"Welcome to your special day 💜";
document.getElementById("note").textContent=c.heroNote||"I made something special just for your smile.";

</script>
<script src="app.js" data-persistent></script>
</body>
</html>
